name: 功能建议
description: 描述希望 MR 帮你完成的任务。
title: '[建议] '
body:
- type: markdown
  attributes:
    value: 这是公开反馈。请勿提交密钥、账号/订单信息、客户代码/聊天、完整日志、个人路径或 Archive/数据库。敏感问题请改用应用内私密反馈。
- type: textarea
  id: goal
  attributes:
    label: 你想完成什么任务
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 现在遇到的阻碍
  validations:
    required: true
- type: textarea
  id: desired
  attributes:
    label: 期望 MR 如何改善
  validations:
    required: true
- type: input
  id: tool
  attributes:
    label: 相关 AI 工具与版本（可选）
- type: checkboxes
  id: privacy
  attributes:
    label: 公开内容确认
    options:
    - label: 我有权公开这些信息，并未包含客户资料或秘密。
      required: true
