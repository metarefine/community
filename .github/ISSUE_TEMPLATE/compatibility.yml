name: 工具 / 模型适配请求
description: 提出新的兼容需求，不代表该功能已被支持。
title: '[适配] '
body:
- type: markdown
  attributes:
    value: 这是公开反馈。请勿提交密钥、账号/订单信息、客户代码/聊天、完整日志、个人路径或 Archive/数据库。敏感问题请改用应用内私密反馈。
- type: input
  id: tool_version
  attributes:
    label: 工具名称与版本
  validations:
    required: true
- type: input
  id: official_docs
  attributes:
    label: 可公开的官方接口说明（可选）
    description: 不要填私密文档链接或带 token 的地址。
- type: dropdown
  id: surface
  attributes:
    label: 最需要的能力
    multiple: true
    options:
    - 本地模型路由
    - 工具结果观察
    - 工具结果替换
    - 记忆保存与任务接续
    - 其他／不确定
  validations:
    required: true
- type: textarea
  id: scenario
  attributes:
    label: 具体使用场景
  validations:
    required: true
- type: checkboxes
  id: privacy
  attributes:
    label: 公开内容确认
    options:
    - label: 我理解这是需求提交，不是已经通过的兼容性认证；内容不含秘密。
      required: true
